name: Build and push image

# The production pipeline, shipped with the skeleton so every property minted
# from it deploys the same way from its first push (PROTOCOL D17):
#
#   test gate → audit gate → build image → push to GHCR
#             → deploy (dev/** or master) → post-deploy HTTP health gate
#
# The test gate is its own job and `build` needs it: no image is built, and so
# nothing is deployed, from a push whose tests fail (BATTLE_SCARS §36).
#
# ─── Parametric entries ──────────────────────────────────────────────────
# Per-property values are NEVER edited into this file. They come from the
# repo's Actions configuration (Settings → Secrets and variables → Actions).
# Every one is OPTIONAL except where noted: each falls back to the value that
# was hardcoded before, so a property that sets nothing behaves identically.
#
#   secret    VPS_DEPLOY_KEY          SSH private key for DEPLOY_HOST.
#                                     Required for any deploy.
#   variable  DEPLOY_HOST             user@host — REQUIRED to enable deploys.
#                                     Unset ⇒ audit + build + push only.
#   variable  PROD_URL                https://example.com — REQUIRED to enable
#                                     the health gate. Unset ⇒ gate skipped.
#   variable  DEPLOY_SITE             site slug passed to deploy-prod/deploy-dev
#                                     on the host. Default: the repository name.
#                                     Set ONLY when the host's site directory
#                                     does not match the repo name.
#   variable  IMAGE_NAME              full image ref without tag.
#                                     Default: ghcr.io/<owner>/<repo>.
#   variable  HEALTH_MIN_BYTES        smallest believable page. Default 5000.
#                                     Raise for content-heavy sites; lower only
#                                     if the front page is genuinely lean.
#   variable  HEALTH_ATTEMPTS         health retries. Default 10.
#   variable  HEALTH_SLEEP_SECONDS    delay between retries. Default 15.
#
# NOT parametric, deliberately: the production branch. GitHub does not allow
# expressions in `on.push.branches`, so a PROD_BRANCH variable would arm the
# deploy condition for a branch that never triggers the workflow — a trap that
# looks configured and silently does nothing. The platform is master-only
# (locked 2026-05-16); a property needing otherwise edits the trigger AND the
# condition together, as one visible change.
#
# The host side of the contract (a `deploy-prod <site>` / `deploy-dev <site>
# <branch>` command reachable over SSH as DEPLOY_HOST) is platform
# infrastructure, documented in docs/DEPLOY.md.

on:
  push:
    branches:
      - master
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deploy per ref at a time. Two pushes in quick succession would otherwise
# race: both pull, both `up -d`, and `drush deploy` can run against a container
# the other job is replacing. Never cancel in progress — a half-applied
# `drush deploy` is worse than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Was this exact code already tested? ───────────────────────────
  # A change normally reaches master as a PR, and test-gate.yml already ran
  # on the PR's head. When the pushed commit is that PR's merge and its tree
  # is byte-identical to the PR head the gate passed on, running the gate
  # again tests the same files twice: 2-6 minutes of Actions per deploy for
  # nothing (docs/DEPLOY.md, "Actions minutes"). Anything else — a direct
  # push, a PR whose branch was behind master, a gate that did not pass, a
  # manual run — gets the full gate below.
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      tested: ${{ steps.reuse.outputs.tested }}
    steps:
      - name: Same tree as a PR head that passed the test gate?
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          tested=false
          if [ "$EVENT" = push ]; then
            # $ENV.SHA is jq's, read from the environment: single quotes on purpose.
            # shellcheck disable=SC2016
            head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .merge_commit_sha == $ENV.SHA)][0].head.sha // empty' || true)
            if [ -n "$head" ]; then
              pushed=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha || true)
              proposed=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha || true)
              passed=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=test" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
              echo "PR head ${head:0:7}: tree $([ -n "$pushed" ] && [ "$pushed" = "$proposed" ] && echo identical || echo differs); passing test gate runs: ${passed:-0}"
              if [ -n "$pushed" ] && [ "$pushed" = "$proposed" ] && [ "${passed:-0}" -ge 1 ]; then
                tested=true
              fi
            fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then
            echo "::notice::The test gate already passed on this exact tree (its PR); not run again."
          fi

  # ─── Test gate ─────────────────────────────────────────────────────
  # scripts/ci/tests.sh in CI, defined once in test-gate.yml so the upstream
  # sync runs the identical gate. `build` needs it: no image is built, and so
  # nothing is deployed, from a push whose tests fail (BATTLE_SCARS §36).
  # Skipped only when `reuse` proved the same tree passed it on its PR.
  test:
    needs: reuse
    if: needs.reuse.outputs.tested != 'true'
    uses: ./.github/workflows/test-gate.yml

  build:
    needs: [reuse, test]
    # Build when the gate passed here, or was skipped because it passed on
    # the PR. A failed or cancelled gate still stops the build.
    if: ${{ !cancelled() && needs.reuse.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # A hung SSH or a wedged buildx would otherwise burn the full 6-hour
    # default before anyone notices.
    timeout-minutes: 30
    steps:
      # Every `uses:` below is on its Node-24 major. GitHub deprecated the
      # Node 20 action runtime (2025-09); older majors warn on every run and
      # will hard-fail when Node 20 is removed. When bumping, verify the new
      # major's action.yml says `using: node24` (or later).
      - uses: actions/checkout@v7

      # Production-only audit: skip dev-dep advisories (test tooling never
      # reaches the runtime image), fail the build on any finding in packages
      # that DO ship. `--locked` audits composer.lock alone via the runner's
      # composer — no PHP extension setup, no install.
      #
      # This gate is fleet-wide by construction: the day an advisory lands
      # against a shared runtime dep, EVERY property's next push stops here.
      # Bump the lock in each property (BATTLE_SCARS §20).
      - name: Composer audit (production deps)
        run: composer audit --no-dev --abandoned=report --format=plain --locked

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}/{1}', github.repository_owner, github.event.repository.name) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,prefix=
            type=sha,enable={{is_default_branch}}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Apache prefork sizing; a site with a larger container sets the
          # repository variable (docs/DEPLOY.md §2).
          build-args: |
            APACHE_PREFORK=${{ vars.APACHE_PREFORK || '3 2 6 20' }}
          # The layer cache is an optimisation, never a gate: a refused cache
          # write (GitHub's cache service answered `error writing layer blob:
          # not_found` on two of three first builds, 2026-10-21) must not fail
          # a build whose image was fine. ignore-error keeps the build green
          # and the next run simply rebuilds the missing layers.
          cache-from: type=gha
          cache-to:   type=gha,mode=max,ignore-error=true

      # ─── Deploy ──────────────────────────────────────────────────────
      # dev/<slug> branches get an ephemeral environment; master is production.
      # Both call a host-side command over SSH; neither touches the DB volume.
      # Schema-changing redeploys (sql:drop + si + recipe) stay an operator
      # action — too destructive to gate behind a code push.
      #
      # Slug and branch travel as env vars rather than inline expressions: a
      # repo or branch name containing shell metacharacters would otherwise be
      # interpolated straight into the remote command string.
      - name: Deploy to dev env
        if: startsWith(github.ref, 'refs/heads/dev/') && vars.DEPLOY_HOST != ''
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SITE: ${{ vars.DEPLOY_SITE || github.event.repository.name }}
          DEV_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_HOST" \
              "deploy-dev $DEPLOY_SITE $DEV_BRANCH"

      # Never silently undeployed. With DEPLOY_HOST unset the image is built and
      # pushed but nothing deploys it, and a green run hides that — a property
      # once built images for weeks that no server ever pulled. Say so loudly.
      - name: Deploy not configured (warn)
        # The upstream itself never deploys; every site built on it should.
        if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST == '' && github.event.repository.name != 'drupal-skeleton'
        run: |
          echo "::warning title=Deploy skipped::vars.DEPLOY_HOST is not set on ${{ github.repository }}: the image was built and pushed but NOT deployed. Set DEPLOY_HOST and PROD_URL (Settings → Secrets and variables → Actions → Variables) and the VPS_DEPLOY_KEY secret."

      # Production auto-deploy on push to master. deploy-prod on the host:
      #   - docker compose pull   (the :latest image we just built)
      #   - docker compose up -d  (recreates drupal container, volumes preserved)
      #   - drush deploy --yes || drush cr   (idempotent reconciliation)
      - name: Deploy to production
        if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SITE: ${{ vars.DEPLOY_SITE || github.event.repository.name }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_HOST" \
              "deploy-prod $DEPLOY_SITE master"

      # ─── Post-deploy health gate ──────────────────────────────────────
      # A green image build proves `composer install` succeeded. It does NOT
      # prove the container serves a page. A property once deployed green and
      # then fataled on EVERY request for ~3.5 days (BATTLE_SCARS §19):
      #
      #   require(/opt/drupal/web/../vendor/autoload_runtime.php): No such
      #   file or directory
      #
      # The decisive detail: the broken site answered HTTP **200** with a
      # 500-byte body, so a plain status check would have gone green. This
      # gate asserts three things — status, a plausible body size, and the
      # absence of PHP fatal signatures — and fails the run if any is off.
      - name: Post-deploy health check
        if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != '' && vars.PROD_URL != ''
        env:
          HEALTH_URL: ${{ vars.PROD_URL }}
          MIN_BYTES: ${{ vars.HEALTH_MIN_BYTES || '5000' }}
          ATTEMPTS: ${{ vars.HEALTH_ATTEMPTS || '10' }}
          SLEEP_SECONDS: ${{ vars.HEALTH_SLEEP_SECONDS || '15' }}
        run: |
          set -u
          fail_body=""
          for i in $(seq 1 "$ATTEMPTS"); do
            code=$(curl -sL -o /tmp/health.html -w '%{http_code}' --max-time 25 "$HEALTH_URL" || echo 000)
            bytes=$(wc -c < /tmp/health.html | tr -d ' ')
            fatal=$(grep -ciE 'Fatal error|Uncaught (Error|Exception)|The website encountered an unexpected error' /tmp/health.html || true)

            echo "attempt $i/$ATTEMPTS: http=$code bytes=$bytes fatal_markers=$fatal"

            if [ "$code" = "200" ] && [ "$bytes" -ge "$MIN_BYTES" ] && [ "$fatal" = "0" ]; then
              echo "::notice::Health check passed — $HEALTH_URL is serving ($bytes bytes)."
              exit 0
            fi

            # A site the operator put in maintenance answers Drupal's maintenance
            # page with 503. deploy-prod restores that state on purpose and never
            # lifts it (lifting is the operator's keystroke), so that page is the
            # expected answer, not a fault. Any other 503, or a PHP fatal, still fails.
            if [ "$code" = "503" ] && grep -q 'class="maintenance-page' /tmp/health.html && [ "$fatal" = "0" ]; then
              echo "::notice::$HEALTH_URL answers its maintenance page, as the operator left it. The deploy is verified; lifting maintenance stays the operator's call."
              exit 0
            fi

            fail_body=$(head -c 800 /tmp/health.html)
            # The container needs a moment after `docker compose up -d`.
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Health check FAILED for $HEALTH_URL after $ATTEMPTS attempts."
          echo "Last response: http=$code bytes=$bytes fatal_markers=$fatal"
          echo "--- first 800 bytes of the response ---"
          echo "$fail_body"
          echo "---------------------------------------"
          echo "The image built and deployed, but the site is not serving a"
          echo "healthy page. Check the container log on the host:"
          echo "  docker logs --tail 50 <compose-project>-drupal-1"
          exit 1
