# DDEV configuration for the drupal-skeleton testbed.
#
# This stack is the lessons-learned default. Notes inline are
# deliberate; future you (or a teammate) needs the WHY of each
# choice, not just the value.

name: drupal-skeleton
type: drupal

# ─── Application root ────────────────────────────────────────────────
docroot: web

# ─── PHP / DB / web server ───────────────────────────────────────────
php_version: "8.3"
database:
  type: mariadb
  version: "11.4"

# apache-fpm — parity with the production image (Dockerfile:
# drupal:11-php8.3-apache) from day one, so .htaccess semantics, rewrite
# behaviour and Traefik upstream routing are exercised locally exactly as
# they run in prod (PROTOCOL D17 supersedes D3). nginx-fpm is marginally
# lighter, and behind Traefik it historically hit "service can't reach
# upstream" friction (BATTLE_SCARS §9); an editorial-only project that
# will never ship an image may switch back.
webserver_type: apache-fpm

# ─── Performance ─────────────────────────────────────────────────────
# Mutagen makes file sync between host and container nearly invisible
# on Win+WSL/macOS hosts. Worth it almost always.
performance_mode: mutagen

# ─── Tooling versions ────────────────────────────────────────────────
composer_version: "2"
# Node 20 reached end-of-life 2026-04-30; 22 is the active LTS line
# (maintained to 2027-04). Bump again when 22 goes EOL.
nodejs_version: "22"

# ─── Routing ─────────────────────────────────────────────────────────
router_http_port: "80"
router_https_port: "443"

# ─── Optional ports (uncomment when needed) ──────────────────────────
# Vite dev server — reachable from host at https://<project>.ddev.site:5173
# web_extra_exposed_ports:
#   - name: vite
#     container_port: 5173
#     http_port: 5172
#     https_port: 5173

# ─── Hooks (keep minimal; everything heavy lives in scripts/) ────────
hooks:
  post-start:
    - exec: php -v
    - exec: composer --version
  post-pull:
    # Any provider's pull re-imports a remote DB whose cache_discovery may point at
    # code that differs locally → Drupal 500s until cache is rebuilt. Rebuild on pull.
    - exec: drush cache:rebuild
