services:
  logger.channel.appointments:
    parent: logger.channel_base
    arguments: ['appointments']

  appointments.calendar:
    class: Drupal\appointments\Calendar
    arguments: ['@config.factory', '@entity_type.manager', '@datetime.time', '@entity.repository']
  Drupal\appointments\Calendar: '@appointments.calendar'

  # The booking page's lifetime as HTTP headers: right after core's
  # FinishResponseSubscriber (0), before edge_purge's tag header (-1024).
  appointments.fresh_headers:
    class: Drupal\appointments\EventSubscriber\FreshHeaders
    arguments: ['@datetime.time', '@page_cache_kill_switch']
    tags:
      - { name: event_subscriber }

  # Re-ages a copy Drupal's page cache serves again: outside page_cache (200).
  appointments.fresh_middleware:
    class: Drupal\appointments\StackMiddleware\FreshMiddleware
    arguments: ['@datetime.time']
    tags:
      - { name: http_middleware, priority: 210 }

  appointments.booking:
    class: Drupal\appointments\BookingManager
    arguments:
      - '@appointments.calendar'
      - '@config.factory'
      - '@lock'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@plugin.manager.mail'
      - '@language_manager'
      - '@logger.channel.appointments'
      - '@?appointments.checkout'
  Drupal\appointments\BookingManager: '@appointments.booking'

  appointments.messages:
    class: Drupal\appointments\Messages
    arguments:
      - '@appointments.calendar'
      - '@date.formatter'
      - '@config.factory'
      - '@string_translation'
      - '@?commerce_price.currency_formatter'
  Drupal\appointments\Messages: '@appointments.messages'

  appointments.seeder:
    class: Drupal\appointments\ServiceSeeder
    arguments: ['@entity_type.manager', '@language_manager']
  Drupal\appointments\ServiceSeeder: '@appointments.seeder'

  appointments.entity_schema:
    class: Drupal\appointments\EntitySchema
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@entity.definition_update_manager'
      - '@entity.last_installed_schema.repository'
  Drupal\appointments\EntitySchema: '@appointments.entity_schema'
