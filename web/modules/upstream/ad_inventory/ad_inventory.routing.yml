ad_inventory.structure:
  path: '/admin/structure/ad-inventory'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Ad inventory'
  requirements:
    _permission: 'administer ad inventory'

ad_inventory.settings:
  path: '/admin/config/services/ad-inventory'
  defaults:
    _form: '\Drupal\ad_inventory\Form\SettingsForm'
    _title: 'Ad inventory'
  requirements:
    _permission: 'administer ad inventory'

ad_inventory.status:
  path: '/admin/config/services/ad-inventory/status'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\StatusController::page'
    _title: 'Ad inventory status'
  requirements:
    _permission: 'administer ad inventory'

# The viewability beacon: POST only, never cached, starts no session.
ad_inventory.beacon:
  path: '/ad/v'
  methods: [POST]
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\CountController::beacon'
  requirements:
    # Public: every reader's browser sends it; ids are checked, nothing else is stored.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

ad_inventory.click:
  path: '/ad/c/{ad_creative}'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\CountController::click'
  requirements:
    # Public: the link on every banner; an inactive creative answers 404.
    _access: 'TRUE'
    ad_creative: '\d+'
  options:
    no_cache: 'TRUE'
    parameters:
      ad_creative:
        type: 'entity:ad_creative'

# "<slot>.png": a placeholder must be a whole path segment, so the suffix is
# part of the value and the controller strips it.
ad_inventory.email_image:
  path: '/ad/e/{image}'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\EmailController::image'
  requirements:
    # Public: the image every mail shows; the same answer for every reader.
    _access: 'TRUE'
    image: '[a-z0-9_]+\.png'

ad_inventory.email_go:
  path: '/ad/e/{slot}/go'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\EmailController::go'
  requirements:
    # Public: the link every mail carries.
    _access: 'TRUE'
    slot: '[a-z0-9_]+'
  options:
    no_cache: 'TRUE'

ad_inventory.email_snippets:
  path: '/admin/structure/ad-inventory/slots/{ad_slot}/email'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\EmailController::snippets'
    _title: 'Email snippets'
  requirements:
    _permission: 'administer ad inventory'

entity.ad_booking.approve_form:
  path: '/admin/content/ad-booking/{ad_booking}/approve'
  defaults:
    _entity_form: 'ad_booking.approve'
    _title: 'Approve booking'
  requirements:
    _entity_access: 'ad_booking.approve'
  options:
    _admin_route: TRUE

entity.ad_booking.stop_form:
  path: '/admin/content/ad-booking/{ad_booking}/stop'
  defaults:
    _entity_form: 'ad_booking.stop'
    _title: 'Stop booking'
  requirements:
    _entity_access: 'ad_booking.stop'
  options:
    _admin_route: TRUE

ad_inventory.booking_report:
  path: '/admin/content/ad-booking/{ad_booking}/report'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\BookingReportController::page'
    _title: 'Booking report'
  requirements:
    _custom_access: '\Drupal\ad_inventory\Controller\BookingReportController::access'
  options:
    _admin_route: TRUE

ad_inventory.booking_report_csv:
  path: '/admin/content/ad-booking/{ad_booking}/report/csv'
  defaults:
    _controller: '\Drupal\ad_inventory\Controller\BookingReportController::csv'
  requirements:
    _custom_access: '\Drupal\ad_inventory\Controller\BookingReportController::access'
  options:
    _admin_route: TRUE
    no_cache: 'TRUE'
