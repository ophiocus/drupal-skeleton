services:
  ad_inventory_report.rollup:
    class: Drupal\ad_inventory_report\Rollup
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@ad_inventory.inventory'
      - '@ad_inventory.calendar'
      - '@state'
      - '@config.factory'
      - '@cache_tags.invalidator'
  Drupal\ad_inventory_report\Rollup: '@ad_inventory_report.rollup'

  ad_inventory_report.data:
    class: Drupal\ad_inventory_report\ReportData
    arguments: ['@database']
  Drupal\ad_inventory_report\ReportData: '@ad_inventory_report.data'

  # ga4_report's snapshot store is optional: money shows only where that
  # module is installed and its AdSense source configured.
  ad_inventory_report.money:
    class: Drupal\ad_inventory_report\Money
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@?ga4_report.store'
  Drupal\ad_inventory_report\Money: '@ad_inventory_report.money'
