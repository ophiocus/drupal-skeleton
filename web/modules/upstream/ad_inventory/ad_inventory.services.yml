services:
  logger.channel.ad_inventory:
    parent: logger.channel_base
    arguments: ['ad_inventory']

  plugin.manager.ad_inventory.provider:
    class: Drupal\ad_inventory\Plugin\AdProviderPluginManager
    parent: default_plugin_manager

  ad_inventory.site_day:
    class: Drupal\ad_inventory\SiteDay
    arguments: ['@datetime.time', '@config.factory']

  # What a page is about, from its URL only. Sites tag their own resolvers
  # `ad_inventory.scope_resolver` to add keys such as a city or a genre.
  ad_inventory.scopes:
    class: Drupal\ad_inventory\Scope\ScopeCollector
    arguments: ['@current_route_match']
    tags:
      - { name: service_collector, tag: ad_inventory.scope_resolver, call: addResolver }

  ad_inventory.overrides:
    class: Drupal\ad_inventory\OverrideStore
    arguments: ['@entity_type.manager']

  ad_inventory.resolver:
    class: Drupal\ad_inventory\AdResolver
    arguments: ['@entity_type.manager', '@ad_inventory.site_day', '@ad_inventory.overrides']

  ad_inventory.slot_builder:
    class: Drupal\ad_inventory\SlotBuilder
    arguments: ['@ad_inventory.resolver', '@ad_inventory.scopes', '@current_user', '@entity_type.manager', '@file_url_generator', '@config.factory']

  ad_inventory.counter:
    class: Drupal\ad_inventory\AdCounter
    arguments: ['@database', '@ad_inventory.site_day']

  ad_inventory.boundaries:
    class: Drupal\ad_inventory\Boundaries
    arguments: ['@entity_type.manager', '@ad_inventory.site_day', '@state', '@cache_tags.invalidator', '@event_dispatcher', '@logger.channel.ad_inventory']

  # The OOP hook class and Drush autowire look constructor type hints up as
  # service ids; without these aliases they fail or vanish silently.
  Drupal\ad_inventory\Boundaries: '@ad_inventory.boundaries'
  Drupal\ad_inventory\AdCounter: '@ad_inventory.counter'
  Drupal\ad_inventory\AdResolver: '@ad_inventory.resolver'
  Drupal\ad_inventory\SlotBuilder: '@ad_inventory.slot_builder'
  Drupal\ad_inventory\OverrideStore: '@ad_inventory.overrides'
  Drupal\ad_inventory\Scope\ScopeCollector: '@ad_inventory.scopes'
  Drupal\ad_inventory\SiteDay: '@ad_inventory.site_day'
