name: 'Ad inventory'
type: module
description: 'Labelled banner slots that keep the page cache: dated bookings, network providers and house creatives filled in the browser after the reader grants advertising consent, first-party view and click counts, email slots served from the edge, and ads.txt lines per provider.'
core_version_requirement: ^11.1
package: Advertising
configure: ad_inventory.settings
dependencies:
  - adstxt:adstxt
  - drupal:block
  - drupal:datetime
  - drupal:image
  - drupal:media
  - drupal:options
  - drupal:user
