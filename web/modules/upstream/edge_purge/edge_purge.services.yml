services:
  edge_purge.queue:
    class: Drupal\edge_purge\PurgeQueue
    arguments: ['@database', '@datetime.time']
  # Drush's AutowireTrait looks each constructor type hint up AS A SERVICE ID;
  # without this alias it silently drops the whole command class.
  Drupal\edge_purge\PurgeQueue: '@edge_purge.queue'

  edge_purge.path_purger:
    class: Drupal\edge_purge\PathPurger
    arguments: ['@edge_purge.queue', '@config.factory', '@?path_alias.manager']
  Drupal\edge_purge\PathPurger: '@edge_purge.path_purger'

  edge_purge.invalidator:
    class: Drupal\edge_purge\Cache\PurgeQueueInvalidator
    arguments: ['@edge_purge.queue']
    tags:
      - { name: cache_tags_invalidator }

  edge_purge.router_rebuild_hold:
    class: Drupal\edge_purge\EventSubscriber\RouterRebuildHold
    tags:
      - { name: event_subscriber }

  edge_purge.cache_tag_header:
    class: Drupal\edge_purge\EventSubscriber\CacheTagHeader
    arguments: ['@asset.query_string']
    tags:
      - { name: event_subscriber }
