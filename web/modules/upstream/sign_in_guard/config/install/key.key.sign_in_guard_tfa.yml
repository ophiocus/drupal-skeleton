id: sign_in_guard_tfa
label: 'Two-factor secrets'
description: 'Encrypts each account''s TOTP seed and recovery codes. The value is the host environment''s TFA_ENCRYPTION_KEY: 32 random bytes, base64. Never in config.'
key_type: encryption
key_type_settings:
  key_size: 256
key_provider: env
key_provider_settings:
  env_variable: TFA_ENCRYPTION_KEY
  base64_encoded: true
  strip_line_breaks: true
key_input: none
key_input_settings: {  }
